[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-dd"
version = "2.0.0"
description = "Sentinel: governed, agentic due-diligence & third-party risk intelligence on authoritative public data (SEC EDGAR, GLEIF, OFAC/UN/UK/EU sanctions, DOJ)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shraddha Todkari" }]
keywords = ["due-diligence", "kyb", "third-party-risk", "sanctions-screening", "langgraph", "rag", "graphrag", "mcp", "claude"]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "PyJWT>=2.8",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "anthropic>=0.40",
  "mcp>=2.0",
  "rapidfuzz>=3.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "langgraph-checkpoint-postgres>=2.0"]
openai = ["openai>=1.40"]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-aiplatform>=1.60"]
embeddings = ["sentence-transformers>=3.0"]
mlops = ["mlflow>=2.14"]
finetune = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33", "bitsandbytes>=0.43"]
crews = ["crewai>=0.80", "pyautogen>=0.2,<0.3"]  # optional adapters; AutoGen 0.4+ changed its API
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7", "pyyaml>=6"]

[project.scripts]
sentinel = "sentinel.cli:main"
sentinel-api = "sentinel.api.main:run"
sentinel-mcp = "sentinel.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m \"not live\""
markers = [
  "live: hits real external sources / providers (opt-in: pytest -m live)",
  "e2e: drives a real browser against the built dashboard",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/sentinel"]
omit = [
  # require external services / GPUs / optional frameworks — exercised in staging, not in hermetic CI
  "src/sentinel/finetune/hf_lora_train.py",
  "src/sentinel/agents/integrations/*",
  "src/sentinel/llm/bedrock_client.py",
  "src/sentinel/llm/vertex_client.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "S105", "S106", "S107", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
