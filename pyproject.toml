[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-dd"
version = "1.0.0"
description = "Sentinel: agentic, governed due-diligence & third-party risk intelligence platform (multi-agent LangGraph + GraphRAG + ML risk scoring + MCP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shraddha Todkari" }]
keywords = ["agentic-ai", "langgraph", "rag", "graphrag", "mcp", "claude", "mlops", "due-diligence", "kyc"]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "PyJWT>=2.8",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "anthropic>=0.40",
  "mcp>=1.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-aiplatform>=1.60"]
vectordb = ["qdrant-client>=1.9", "psycopg[binary]>=3.1", "pgvector>=0.2"]
embeddings = ["sentence-transformers>=3.0"]
mlops = ["mlflow>=2.14", "prometheus-client>=0.20"]
finetune = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "datasets>=2.20", "accelerate>=0.33"]
multimodal = ["pypdf>=4.2", "pillow>=10.3", "pytesseract>=0.3"]
crews = ["crewai>=0.80", "pyautogen>=0.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
sentinel-api = "sentinel.api.main:run"
sentinel-mcp = "sentinel.mcp_server.server:main"
sentinel-train = "sentinel.ml.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "live: requires real provider credentials (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/sentinel"]
omit = [
  "src/sentinel/finetune/hf_lora_train.py",
  "src/sentinel/agents/integrations/*",
  "src/sentinel/llm/bedrock_client.py",
  "src/sentinel/llm/vertex_client.py",
  "src/sentinel/vectorstore/qdrant_store.py",
  "src/sentinel/vectorstore/pgvector_store.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "S105", "S106", "S107", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
