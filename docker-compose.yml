# Local production-like stack: API + Qdrant + Postgres/pgvector + MLflow + Prometheus
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      SENTINEL_ENV: dev                      # enables /auth/token demo login; use 'prod' behind an IdP
      SENTINEL_MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [qdrant, postgres, mlflow]
    read_only: true
    tmpfs: [/tmp]
    volumes: [sentinel-var:/app/var]
    security_opt: ["no-new-privileges:true"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel          # local only; use a secret manager in cloud environments
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

volumes:
  sentinel-var: {}
  qdrant-data: {}
  pg-data: {}
  mlflow-data: {}
