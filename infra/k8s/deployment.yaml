apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels: {app: sentinel-api}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: sentinel-api}}
  template:
    metadata:
      labels: {app: sentinel-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000"}
    spec:
      serviceAccountName: sentinel-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/your-org/sentinel-dd:1.0.0
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: sentinel-config}
            - secretRef: {name: sentinel-secrets}     # synced from AWS Secrets Manager / GCP Secret Manager
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: var, mountPath: /app/var}]
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: var, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: sentinel-api}
spec:
  selector: {app: sentinel-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: sentinel-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sentinel-api}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: sentinel-api}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: sentinel-api}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sentinel-api}
spec:
  podSelector: {matchLabels: {app: sentinel-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {name: ingress}}}]
      ports: [{port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {app: qdrant}}}, {podSelector: {matchLabels: {app: postgres}}}]
    - ports: [{port: 443, protocol: TCP}, {port: 53, protocol: UDP}]   # LLM provider APIs + DNS
