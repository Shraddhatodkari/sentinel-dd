apiVersion: v1
kind: ConfigMap
metadata: {name: sentinel-config}
data:
  SENTINEL_ENV: prod
  SENTINEL_LOG_LEVEL: INFO
  SENTINEL_LLM_PROVIDER: anthropic
  SENTINEL_LLM_FALLBACKS: '["bedrock"]'
  SENTINEL_VECTOR_BACKEND: qdrant
  SENTINEL_QDRANT_URL: http://qdrant:6333
  SENTINEL_HITL_RISK_THRESHOLD: "0.6"
  SENTINEL_GROUNDING_THRESHOLD: "0.35"
  SENTINEL_RATE_LIMIT_PER_MINUTE: "120"
---
# Template only — never commit real values. Populate via External Secrets Operator.
apiVersion: v1
kind: Secret
metadata: {name: sentinel-secrets}
type: Opaque
stringData:
  SENTINEL_ANTHROPIC_API_KEY: "<from-secret-manager>"
  SENTINEL_JWT_SECRET: "<from-secret-manager>"
